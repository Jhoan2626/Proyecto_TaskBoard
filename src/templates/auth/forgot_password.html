{% extends "base.html" %}

{% block title %}Recuperar Contraseña{% endblock %}

{% block content %}
<div style="max-width: 420px; margin: 2rem auto;">
    <div class="card">
        <h2 class="card-title text-center">Recuperar Contraseña</h2>

        <p class="text-muted text-center" style="margin-bottom: 1.5rem; font-size: 0.95rem;">
            Ingresa tu correo registrado y te enviaremos un enlace para restablecer tu contraseña.
        </p>

        <form method="POST" action="{{ url_for('auth.forgot_password') }}">
            <div class="form-group">
                <label for="email" class="form-label">Correo Electrónico</label>
                <input type="email" id="email" name="email" class="form-control"
                       required value="{{ email or '' }}" placeholder="ejemplo@correo.com"
                       autocomplete="email">
            </div>

            <button type="submit" class="btn btn-primary" style="width: 100%;">
                Enviar enlace de recuperación
            </button>
        </form>

        <p class="text-center text-muted" style="margin-top: 1.25rem; font-size: 0.9rem;">
            ¿Recordaste tu contraseña? <a href="{{ url_for('auth.login') }}">Inicia sesión</a>
        </p>
    </div>
</div>
{% endblock %}
