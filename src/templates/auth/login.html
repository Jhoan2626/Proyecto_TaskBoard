{% extends "base.html" %}

{% block title %}Iniciar Sesión{% endblock %}

{% block content %}
<div style="max-width: 420px; margin: 2rem auto;">
    <div class="card">
        <h2 class="card-title text-center">Iniciar Sesión</h2>
        <form method="POST" action="{{ url_for('auth.login', next=request.args.get('next')) }}">
            <div class="form-group">
                <label for="email" class="form-label">Correo Electrónico</label>
                <input type="email" id="email" name="email" class="form-control" required value="{{ email or '' }}" placeholder="ejemplo@correo.com">
            </div>

            <div class="form-group">
                <label for="password" class="form-label">Contraseña</label>
                <input type="password" id="password" name="password" class="form-control" required placeholder="••••••••">
            </div>

            <button type="submit" class="btn btn-primary" style="width: 100%;">Ingresar</button>
        </form>

        <p class="text-center text-muted" style="margin-top: 1.25rem; font-size: 0.9rem;">
            ¿No tienes cuenta? <a href="{{ url_for('auth.register') }}">Regístrate aquí</a>
        </p>
        <p class="text-center text-muted" style="font-size: 0.85rem;">
            <a href="{{ url_for('auth.forgot_password') }}">¿Olvidaste tu contraseña?</a>
        </p>
    </div>
</div>
{% endblock %}
