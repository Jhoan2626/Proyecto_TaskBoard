{% extends "base.html" %}

{% block title %}Registro de Usuario{% endblock %}

{% block content %}
<div style="max-width: 420px; margin: 2rem auto;">
    <div class="card">
        <h2 class="card-title text-center">Crear Cuenta</h2>
        <form method="POST" action="{{ url_for('auth.register') }}">
            <div class="form-group">
                <label for="email" class="form-label">Correo Electrónico</label>
                <input type="email" id="email" name="email" class="form-control" required value="{{ email or '' }}" placeholder="ejemplo@correo.com">
                <small class="text-muted">Se validará formato estándar y unicidad.</small>
            </div>

            <div class="form-group">
                <label for="password" class="form-label">Contraseña</label>
                <input type="password" id="password" name="password" class="form-control" minlength="6" required placeholder="Mínimo 6 caracteres">
                <small class="text-muted">Se almacena de forma segura usando hash criptográfico.</small>
            </div>

            <button type="submit" class="btn btn-primary" style="width: 100%;">Registrarse</button>
        </form>

        <p class="text-center text-muted" style="margin-top: 1.25rem; font-size: 0.9rem;">
            ¿Ya tienes cuenta? <a href="{{ url_for('auth.login') }}">Inicia sesión</a>
        </p>
    </div>
</div>
{% endblock %}
