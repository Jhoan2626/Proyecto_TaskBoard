{% extends "base.html" %}

{% block title %}Restablecer Contraseña{% endblock %}

{% block content %}
<div style="max-width: 420px; margin: 2rem auto;">
    <div class="card">
        <h2 class="card-title text-center">Restablecer Contraseña</h2>

        <p class="text-muted text-center" style="margin-bottom: 1.5rem; font-size: 0.95rem;">
            Elige una nueva contraseña de al menos 8 caracteres.
        </p>

        <form method="POST" action="{{ url_for('auth.reset_password', token=token) }}">
            <div class="form-group">
                <label for="password" class="form-label">Nueva Contraseña</label>
                <input type="password" id="password" name="password" class="form-control"
                       required minlength="8" placeholder="Mínimo 8 caracteres"
                       autocomplete="new-password">
            </div>

            <div class="form-group">
                <label for="confirm_password" class="form-label">Confirmar Contraseña</label>
                <input type="password" id="confirm_password" name="confirm_password" class="form-control"
                       required minlength="8" placeholder="Repite la contraseña"
                       autocomplete="new-password">
            </div>

            <button type="submit" class="btn btn-primary" style="width: 100%;">
                Guardar nueva contraseña
            </button>
        </form>

        <p class="text-center text-muted" style="margin-top: 1.25rem; font-size: 0.9rem;">
            <a href="{{ url_for('auth.forgot_password') }}">Solicitar un nuevo enlace</a>
        </p>
    </div>
</div>
{% endblock %}
