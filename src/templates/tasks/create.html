{% extends "base.html" %}

{% block title %}Nueva Tarea{% endblock %}

{% block content %}
<div style="max-width: 600px; margin: 1.5rem auto;">
    <div class="card">
        <h2 class="card-title">Crear Nueva Tarea (HU-01)</h2>
        <form method="POST" action="{{ url_for('tasks.create_task') }}">
            <div class="form-group">
                <label for="title" class="form-label">Título de la Tarea <span class="text-danger">*</span></label>
                <input type="text" id="title" name="title" class="form-control" required value="{{ title or '' }}" placeholder="Ej: Redactar documentación de arquitectura" maxlength="200">
                <small class="text-muted">El título es obligatorio y no puede estar vacío.</small>
            </div>

            <div class="form-group">
                <label for="description" class="form-label">Descripción (Opcional)</label>
                <textarea id="description" name="description" class="form-control" rows="4" placeholder="Detalles de la tarea...">{{ description or '' }}</textarea>
            </div>

            <div class="form-group">
                <label for="due_date" class="form-label">Fecha Límite (Opcional)</label>
                <input type="date" id="due_date" name="due_date" class="form-control" value="{{ due_date or '' }}">
                <small class="text-muted">Formato YYYY-MM-DD.</small>
            </div>

            <div style="display: flex; gap: 0.75rem; justify-content: flex-end;">
                <a href="{{ url_for('tasks.list_tasks') }}" class="btn btn-secondary">Cancelar</a>
                <button type="submit" class="btn btn-primary">Guardar Tarea</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
